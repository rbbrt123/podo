services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    env_file:
      - .env

  frontend:
    build: ./frontend
    ports:
      - "7860:7860"
    environment:
      - PODO_BACKEND_URL=http://backend:8000
      - GRADIO_SERVER_NAME=0.0.0.0
    depends_on:
      - backend